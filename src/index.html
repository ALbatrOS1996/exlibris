<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ex Libris</title>
<meta name="description" content="Dziennik lektur: postęp czytania, kalendarz ukończonych książek, Kanon Europy i reportaże Czarnego.">
<meta name="theme-color" content="#1c2220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--PWA-->
<!--CSS-->
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" data-go="shelf">
      <svg viewBox="0 0 40 40" class="brand-mark" aria-hidden="true"><use href="#i-seal"/></svg>
      <div><b>Ex Libris</b><small id="rankLine">Uczeń skryptorium</small></div>
    </div>
    <button class="icon-btn" id="btnTheme" aria-label="Zmień motyw"><svg><use href="#i-moon"/></svg></button>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Dodaj książkę"><svg><use href="#i-plus"/></svg></button>

  <nav class="tabs" id="tabs">
    <button data-go="shelf" class="on"><svg><use href="#i-shelf"/></svg><span>Półka</span></button>
    <button data-go="cal"><svg><use href="#i-cal"/></svg><span>Kalendarz</span></button>
    <button data-go="kanon"><svg><use href="#i-column"/></svg><span>Kanon</span></button>
    <button data-go="czarne"><svg><use href="#i-pen"/></svg><span>Czarne</span></button>
    <button data-go="trophy"><svg><use href="#i-laurel"/></svg><span>Trofea</span></button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <div class="sheet-grip" data-close></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toasts"></div>
<canvas id="confetti"></canvas>
<div id="celebrate" hidden></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-shelf" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 4h4v16H4zM9 6h4v14H9z"/><path d="M14.5 7.2l3.8-1 3.2 13.6-3.8 1z"/></g></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></g><circle cx="12" cy="15" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-column" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8l9-4 9 4H3zM5 20h14M4 22h16"/><path d="M6.5 10v8M10 10v8M14 10v8M17.5 10v8"/></g></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c3-1 5-3 7-6l6-9 2 1.5-6 9c-2 3-4.5 4.5-9 4.5z"/><path d="M14 9l2.5 1.6"/></g></symbol>
    <symbol id="i-laurel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 21c-5-1-8-5-8-11M12 21c5-1 8-5 8-11"/><path d="M5.2 14.5c-1.6-.3-2.6-1.4-2.8-3 1.6.1 2.6 1.2 2.8 3zM6.8 18c-1.5.3-2.8-.3-3.5-1.7 1.5-.3 2.8.3 3.5 1.7zM4.4 10.6C3 9.9 2.6 8.6 3 7.2c1.3.7 1.7 2 1.4 3.4zM18.8 14.5c1.6-.3 2.6-1.4 2.8-3-1.6.1-2.6 1.2-2.8 3zM17.2 18c1.5.3 2.8-.3 3.5-1.7-1.5-.3-2.8.3-3.5 1.7zM19.6 10.6c1.4-.7 1.8-2 1.4-3.4-1.3.7-1.7 2-1.4 3.4z"/></g><circle cx="12" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4.2 0 7-2.8 7-6.6 0-3.5-2.4-5.4-3.7-8.4-.6 2.2-1.7 3.3-2.8 3.6C12.8 7 11 4.2 8.4 2.5 8.7 6.6 5 9.4 5 15.4 5 19.2 7.8 22 12 22z" fill="currentColor"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="currentColor"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.8-2.5h6.4L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.4"/></g></symbol>
    <symbol id="i-barcode" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6v12M7 6v12M10 6v12M12.5 6v12M16 6v12M18.5 6v12M20.5 6v12"/></g></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></g></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 6.5C10 5 7.5 4.5 4 4.5v14c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2v-14c-3.5 0-6 .5-8 2zM12 6.5v14"/></g></symbol>
    <symbol id="i-seal" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="var(--sage)"/><circle cx="20" cy="20" r="13.5" fill="none" stroke="var(--on-sage)" stroke-width="1.2" stroke-dasharray="2 2.2" opacity=".55"/><path d="M13 27.5V13.5h8.5M13 20h6.5M13 27.5h8.5M23.5 13.5l5.5 14M29 13.5l-5.5 14" fill="none" stroke="var(--on-sage)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>
<!--JS-->
</body>
</html>
